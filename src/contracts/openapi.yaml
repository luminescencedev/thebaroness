          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Joueur déjà suivi (`ALREADY_TRACKED`) ou limite de 100 suivis atteinte (`TRACKED_LIMIT_REACHED`, v1.12.0)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ALREADY_TRACKED
                  message: Ce joueur est déjà dans votre liste.
        "429":
          $ref: "#/components/responses/RateLimited"
  /tracked-players/insights:
    get:
      tags:
        - Suivis
      summary: Insights groupés de mes suivis
      description: "v1.12.0. Une carte par suivi (100 au plus, dans l’ordre de `GET /tracked-players`) : identité, rang connu, dernière partie et forme sur les 10 dernières parties scorées. Lit le cache partagé profil/historique, 4 joueurs à la fois. Un joueur en échec garde sa ligne (`status`, `error`) sans faire échouer la liste."
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Insights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedInsights"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /tracked-players/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        example: 507f1f77bcf86cd799439012
    get:
      tags:
        - Suivis
      summary: Consulter un suivi
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suivi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedPlayer"
              example:
                id: 507f1f77bcf86cd799439012
                steamId: "76561198000000000"
                alias: Duo régulier
                note: Joue souvent en classé
                tags:
                  - duo
                  - ranked
                createdAt: 2026-11-16T09:00:00.000Z
                updatedAt: 2026-11-16T09:00:00.000Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags:
        - Suivis
      summary: Modifier un suivi (partiel)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedPlayerUpdate"
            example:
              note: Analyse mise à jour
      responses:
        "200":
          description: Suivi modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedPlayer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - Suivis
      summary: Supprimer un suivi
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Supprimé, sans corps
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 obtenu via la connexion Steam (`#token=` au retour).
  responses:
    BadRequest:
      description: Entrée invalide (champ, identifiant, JSON, PATCH vide…)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_INPUT
              message: "tags : 10 tags maximum"
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Session absente ou expirée.
    NotFound:
      description: Ressource absente ou appartenant à un autre compte (pas de divulgation d'existence)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: Ressource introuvable.
    RateLimited:
      description: Trop de requêtes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Trop de requêtes, réessayez dans quelques instants.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes
    UpstreamError:
      description: Réponse inexploitable du fournisseur de statistiques
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UPSTREAM_ERROR
              message: Réponse inexploitable du fournisseur de statistiques.
    ServiceUnavailable:
      description: Fournisseur de statistiques indisponible et aucune copie en cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Les statistiques sont temporairement indisponibles.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - UNAUTHORIZED
                - NOT_FOUND
                - ALREADY_TRACKED
                - TRACKED_LIMIT_REACHED
                - RATE_LIMITED
                - UPSTREAM_ERROR
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
    DataMeta:
      type: object
      required:
        - fetchedAt
        - sourceUpdatedAt
        - isStale
        - isPartial
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Date de collecte
        sourceUpdatedAt:
          type:
            - string
            - "null"
          format: date-time
        isStale:
          type: boolean
          description: Copie en cache servie faute de fournisseur
        isPartial:
          type: boolean
          description: Une partie des données est indisponible
    PublicUser:
      type: object
      required:
        - id
        - steamId
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
        steamId:
          type: string
          pattern: ^\d{17}$
        displayName:
          type: string
          description: "Pseudo Steam (repli : le steamId)"
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
    PlayerSummary:
      type: object
      required:
        - steamId
        - accountId
        - displayName
        - avatarUrl
      properties:
        steamId:
          type: string
          pattern: ^\d{17}$
        accountId:
          type: integer
          description: SteamID3 (32 bits)
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
    PlayerSearchResult:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        meta:
          $ref: "#/components/schemas/DataMeta"
    PlayerStats:
      type: object
      description: Agrégats sur les parties disponibles ; `null` si inconnu.
      required:
        - matchesPlayed
        - wins
        - losses
        - winRate
        - kills
        - deaths
        - assists
        - kda
      properties:
        matchesPlayed:
          type:
            - integer
            - "null"
        wins:
          type:
            - integer
            - "null"
        losses:
          type:
            - integer
            - "null"
        winRate:
          type:
            - number
            - "null"
          description: En %, 2 décimales
        kills:
          type:
            - integer
            - "null"
        deaths:
          type:
            - integer
            - "null"
        assists:
          type:
            - integer
            - "null"
        kda:
          type:
            - number
            - "null"
          description: (K + A) / max(D, 1), 2 décimales
    PlayerProfile:
      type: object
      required:
        - player
        - stats
        - rank
        - meta
      properties:
        player:
          allOf:
            - $ref: "#/components/schemas/PlayerSummary"
            - type: object
              properties:
                region:
                  type:
                    - string
                    - "null"
                  description: Code pays Steam (ex. FR)
        stats:
          $ref: "#/components/schemas/PlayerStats"
        rank:
          $ref: "#/components/schemas/PlayerRank"
        meta:
          $ref: "#/components/schemas/DataMeta"
    PlayerRank:
      type: object
      description: Rang issu de la partie classée la plus récente (`ranked_display_badge`). Tout à `null` si aucune partie classée connue.
      required:
        - badgeId
        - name
        - tier
        - subrank
        - imageUrl
        - color
      properties:
        badgeId:
          type:
            - integer
            - "null"
          description: "`tier * 10 + subrank` (ex. 113)"
        name:
          type:
            - string
            - "null"
          example: Eternus 3
        tier:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 11
        subrank:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 6
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        color:
          type:
            - string
            - "null"
          example: "#5CE9A9"
    RankTier:
      type: object
      required:
        - tier
        - name
        - color
        - imageUrl
        - subranks
      properties:
        tier:
          type: integer
          minimum: 0
          maximum: 11
        name:
          type: string
          example: Eternus
        color:
          type: string
        imageUrl:
          type: string
          format: uri
        subranks:
          type: array
          minItems: 6
          maxItems: 6
          description: Images des sous-rangs 1 à 6 (index 0 = sous-rang 1)
          items:
            type:
              - string
              - "null"
            format: uri
    HeroImages:
      type: object
      required:
        - card
        - small
        - vertical
        - background
        - name
      properties:
        card:
          type: string
        small:
          type: string
        vertical:
          type: string
        background:
          type: string
        name:
          type:
            - string
            - "null"
    HeroSummary:
      type: object
      required:
        - id
        - name
        - role
        - gunTag
        - complexity
        - tags
        - color
        - images
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum:
            - assassin
            - brawler
            - marksman
            - mystic
            - healer
        gunTag:
          type:
            - string
            - "null"
        complexity:
          type:
            - integer
            - "null"
        tags:
          type: array
          items:
            type: string
        color:
          type: string
          description: Couleur d’accent hexadécimale
        images:
          $ref: "#/components/schemas/HeroImages"
    HeroDetail:
      allOf:
        - $ref: "#/components/schemas/HeroSummary"
        - type: object
          required:
            - lore
            - stats
            - abilities
          properties:
            lore:
              type: string
            stats:
              type: array
              items:
                type: object
                required:
                  - key
                  - label
                  - value
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  value:
                    type: number
            abilities:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                  - imageUrl
                  - type
                  - description
                  - cooldownSeconds
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  imageUrl:
                    type:
                      - string
                      - "null"
                  type:
                    type: string
                    enum:
                      - signature
                      - ultimate
                  description:
                    type: string
                  cooldownSeconds:
                    type:
                      - number
                      - "null"
    Group:
      type: object
      required:
        - id
        - name
        - steamIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        steamIds:
          type: array
          items:
            type: string
            pattern: ^\d{17}$
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GroupInput:
      type: object
      required:
        - name
        - steamIds
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trim appliqué
        steamIds:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          description: Doublons détectés après normalisation
          items:
            type: string
            description: SteamID64 (17 chiffres), code ami Steam/Deadlock (account ID 32 bits), `[U:1:n]` ou URL `https://steamcommunity.com/profiles/<SteamID64>`. Normalisé en SteamID64 ; les URL `/id/<pseudo>` sont refusées.
            examples:
              - "76561198957316510"
              - "997050782"
              - https://steamcommunity.com/profiles/76561198957316510
    GroupCompare:
      type: object
      required:
        - group
        - period
        - members
        - highlights
        - methodology
        - meta
      properties:
        group:
          $ref: "#/components/schemas/Group"
        period:
          type: string
          enum:
            - 7d
            - 30d
            - season
        members:
          type: array
          items:
            type: object
            required:
              - steamId
              - displayName
              - avatarUrl
              - rank
              - matches
              - wins
              - losses
              - winRate
              - kda
              - longestWinStreak
              - bestMatch
              - rankHistory
              - kdaSampleSize
              - currentRankScore
              - rankDelta
            properties:
              steamId:
                type: string
              displayName:
                type: string
              avatarUrl:
                type:
                  - string
                  - "null"
              rank:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/PlayerRank"
              matches:
                type: integer
              wins:
                type: integer
              losses:
                type: integer
              winRate:
                type:
                  - number
                  - "null"
              kda:
                type:
                  - number
                  - "null"
                description: (K + A) / max(D, 1)
              longestWinStreak:
                type: integer
              bestMatch:
                oneOf:
                  - type: "null"
                  - type: object
                    required:
                      - matchId
                      - playedAt
                      - heroName
                      - heroImageUrl
                      - kills
                      - deaths
                      - assists
                      - netWorth
                      - kda
                    properties:
                      matchId:
                        type: string
                      playedAt:
                        type: string
                        format: date-time
                      heroName:
                        type: string
                      heroImageUrl:
                        type:
                          - string
                          - "null"
                      kills:
                        type: integer
                      deaths:
                        type: integer
                      assists:
                        type: integer
                      netWorth:
                        type:
                          - integer
                          - "null"
                      kda:
                        type:
                          - number
                          - "null"
              rankHistory:
                type: array
                description: Parties classées de la période, du plus ancien au plus récent
                items:
                  type: object
                  required:
                    - at
                    - score
                    - badge
                  properties:
                    at:
                      type: string
                      format: date-time
                    score:
                      type: integer
                      minimum: 1
                      maximum: 72
                      description: tier * 6 + subrank
                    badge:
                      type: integer
                      description: v1.12.0. tier * 10 + subrank
              kdaSampleSize:
                type: integer
                minimum: 0
                description: Nombre de parties utilisées pour le KDA (v1.12.0).
              currentRankScore:
                type:
                  - integer
                  - "null"
                description: v1.12.0. `tier * 6 + subrank` de `rank` ; null si non classé.
              rankDelta:
                type:
                  - integer
                  - "null"
                description: v1.12.0. Dernier − premier `score` de `rankHistory` (sous-rangs gagnés) ; null sous 2 points.
        highlights:
          type: array
          description: v1.12.0. Toujours 6 entrées, dans cet ordre. Valeur strictement positive ; égalité → tous les ex æquo dans l’ordre du groupe ; winrate et KDA à partir de 5 parties.
          items:
            type: object
            required:
              - key
              - steamIds
              - value
              - matchId
              - eligibleMembers
              - minMatches
            properties:
              key:
                type: string
                enum:
                  - biggest_climb
                  - best_win_rate
                  - most_wins
                  - best_kda
                  - longest_win_streak
                  - best_match
              steamIds:
                type: array
                items:
                  type: string
              value:
                type:
                  - number
                  - "null"
              matchId:
                type:
                  - string
                  - "null"
                description: "`best_match` seulement"
              eligibleMembers:
                type: integer
              minMatches:
                type: integer
        methodology:
          type: object
          description: v1.12.0. Règles appliquées.
          required:
            - periodFrom
            - rankScore
            - kda
            - highlightMinMatches
            - ties
          properties:
            periodFrom:
              type:
                - string
                - "null"
              format: date-time
            rankScore:
              type: string
            kda:
              type: string
            highlightMinMatches:
              type: integer
            ties:
              type: string
        meta:
          $ref: "#/components/schemas/DataMeta"
    HeroMetaStats:
      type: object
      required:
        - heroId
        - matches
        - winRate
        - pickRate
        - avgKills
        - avgDeaths
        - avgAssists
        - winRateByTier
      properties:
        heroId:
          type: integer
        matches:
          type:
            - integer
            - "null"
        winRate:
          type:
            - number
            - "null"
          description: "%"
        pickRate:
          type:
            - number
            - "null"
          description: "% des parties"
        avgKills:
          type:
            - number
            - "null"
        avgDeaths:
          type:
            - number
            - "null"
        avgAssists:
          type:
            - number
            - "null"
        winRateByTier:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required:
              - tier
              - winRate
              - matches
            properties:
              tier:
                type: integer
                minimum: 0
                maximum: 11
              winRate:
                type:
                  - number
                  - "null"
                description: null sous 200 parties
              matches:
                type:
                  - integer
                  - "null"
    HeroMetaBatch:
      type: object
      required:
        - items
        - unknownHeroIds
        - scope
        - coverage
        - meta
      properties:
        items:
          type: array
          description: "Un `HeroMetaStats` par héros jouable demandé, dans l’ordre demandé. Héros sans donnée dans la fenêtre : valeurs null."
          items:
            $ref: "#/components/schemas/HeroMetaStats"
        unknownHeroIds:
          type: array
          description: Ids demandés inconnus ou non jouables
          items:
            type: integer
        scope:
          type: object
          required:
            - period
            - gameMode
            - matchMode
          properties:
            period:
              type: string
              enum:
                - 30d
            gameMode:
              type: string
              enum:
                - normal
            matchMode:
              type: string
              enum:
                - all
        coverage:
          type: object
          required:
            - requested
            - known
            - withStats
          properties:
            requested:
              type: integer
              description: Ids distincts demandés
            known:
              type: integer
              description: Héros jouables parmi eux (= taille de `items`)
            withStats:
              type: integer
              description: Héros avec `matches` non null
        meta:
          $ref: "#/components/schemas/DataMeta"
    LeaderboardEntry:
      type: object
      required:
        - rank
        - displayName
        - steamId
        - inferred
        - badge
        - topHeroes
      properties:
        rank:
          type: integer
          description: Position (ex aequo possibles)
        displayName:
          type: string
        steamId:
          type:
            - string
            - "null"
          description: "Compte du joueur. Pseudo partagé par plusieurs comptes : celui au rang le plus élevé (voir `inferred`). null si la source ne relie le pseudo à aucun compte, ou à plusieurs sans rang connu."
        avatarUrl:
          type:
            - string
            - "null"
          description: v1.12.0. Avatar Steam du compte `steamId` (un appel groupé, cache 6 h) ; null si inconnu.
        inferred:
          type: boolean
          description: true si `steamId` et `badge` ont été déduits parmi plusieurs comptes homonymes (compte au rang le plus élevé, puis à la partie classée la plus récente).
        badge:
          description: Rang à la fin de la dernière partie classée du compte `steamId` (`/v1/players/rank`). null si aucun compte ou aucun rang connu, ou si la source des rangs est indisponible (`meta.isPartial`). Environ 94 entrées sur 100 en Europe.
          oneOf:
            - type: "null"
            - type: object
              required:
                - tier
                - subrank
                - name
                - imageUrl
                - badgeId
                - color
              properties:
                tier:
                  type: integer
                subrank:
                  type: integer
                name:
                  type: string
                imageUrl:
                  type:
                    - string
                    - "null"
                badgeId:
                  type:
                    - integer
                    - "null"
                  description: v1.12.0. tier × 10 + subrank
                color:
                  type:
                    - string
                    - "null"
                  description: v1.12.0
        topHeroes:
          type: array
          maxItems: 3
          items:
            type: object
            required:
              - heroId
              - name
              - imageUrl
            properties:
              heroId:
                type: integer
              name:
                type: string
              imageUrl:
                type:
                  - string
                  - "null"
    MatchPlayer:
      type: object
      required:
        - steamId
        - displayName
        - heroId
        - heroName
        - heroImageUrl
        - level
        - kills
        - deaths
        - assists
        - netWorth
        - lastHits
        - denies
        - mvpRank
        - killParticipation
        - stats
        - purchases
        - finalItemIds
        - abilityUpgrades
        - kda
        - netWorthRank
        - teamNetWorthRank
        - lastHitsPerMinute
        - performanceTags
      properties:
        steamId:
          type:
            - string
            - "null"
        displayName:
          type: string
          description: "Repli : SteamID, puis « Joueur inconnu »"
        heroId:
          type: integer
        heroName:
          type: string
        heroImageUrl:
          type:
            - string
            - "null"
        level:
          type:
            - integer
            - "null"
        kills:
          type:
            - integer
            - "null"
        deaths:
          type:
            - integer
            - "null"
        assists:
          type:
            - integer
            - "null"
        netWorth:
          type:
            - integer
            - "null"
        lastHits:
          type:
            - integer
            - "null"
        denies:
          type:
            - integer
            - "null"
        mvpRank:
          type:
            - integer
            - "null"
