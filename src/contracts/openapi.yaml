  /players/{steamId}/trends:
    get:
      tags:
        - Joueurs
      summary: "Tendances : N dernières parties contre les N précédentes"
      description: "Depuis l’historique en cache. `previous` est null s’il n’y a pas `size` parties avant les `size` dernières (jamais de comparaison inégale). Winrate glissant sur 10 parties, défini à partir de la 10e partie. v1.12.0 : `series` (une entrée par partie du bloc récent : KDA, souls/min, winrate glissant) et `period` optionnel (sans période : tout l’historique, comportement v1.11)."
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: size
          in: query
          schema:
            type: integer
            minimum: 5
            maximum: 50
            default: 20
        - name: period
          in: query
          description: "`7d` et `30d` : fenêtre glissante UTC depuis l’instant de la requête. `season` : depuis le début de la saison classée courante (source Deadlock API) ; si inconnu, aucune borne et `meta.isPartial`. Absent : tout l’historique (comportement v1.8)."
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - season
        - name: gameMode
          in: query
          description: "Mode de jeu (axe indépendant de `matchMode`) : `normal` inclut classées et non classées. Une partie au mode inconnu n’est retenue que sous `all`."
