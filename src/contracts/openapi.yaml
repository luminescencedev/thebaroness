                          enum:
                            - win
                            - loss
                      matchIds:
                        type: array
                        items:
                          type: string
                      wins:
                        type: integer
                      losses:
                        type: integer
                      winRate:
                        type:
                          - number
                          - "null"
                      sampleSize:
                        type: integer
                        description: ≤ requestedSize
                      requestedSize:
                        type: integer
                        enum:
                          - 10
              meta:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/DataMeta"
              error:
                oneOf:
                  - type: "null"
                  - type: object
                    required:
