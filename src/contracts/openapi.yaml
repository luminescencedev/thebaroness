              - normal
              - street_brawl
            default: all
        - name: matchMode
          in: query
          description: Type de partie. Une partie au type inconnu n’est retenue que sous `all`.
          schema:
            type: string
            enum:
              - all
              - ranked
              - unranked
            default: all
      responses:
        "200":
          description: Héros joués
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - appliedFilters
                  - metaContext
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerHeroStat"
                  appliedFilters:
                    $ref: "#/components/schemas/AppliedFilters"
                  metaContext:
                    description: v1.12.0. Périmètre de la méta globale. null si elle est indisponible (`globalMeta` null partout).
