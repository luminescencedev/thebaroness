# Copie figée du contrat OpenAPI du backend
# Source : thebaroness-back, docs/openapi.yaml v1.14.0, commit 479348f (18/11/2026)
# Généré depuis src/docs/openapi.ts (v1.14.0) par `npm run openapi`.
# Ne pas modifier à la main.
openapi: 3.1.0
info:
  title: thebaroness API
  version: 1.14.0
  description: "API du tracker de statistiques Deadlock. Les statistiques proviennent de Deadlock API (api.deadlock-api.com, source communautaire indépendante de Valve) ; l'espace privé est stocké dans MongoDB. Erreurs : `{ \"error\": { \"code\", \"message\" } }`. Inconnu = `null`, jamais 0."
servers:
  - url: /api
tags:
  - name: Santé
  - name: Authentification
    description: Connexion Steam OpenID uniquement.
  - name: Joueurs
    description: Données publiques issues de Deadlock API, avec cache.
  - name: Suivis
    description: Liste privée de joueurs suivis (Bearer JWT).
  - name: Catalogue
    description: Héros, rangs, carte (assets Deadlock, en anglais).
  - name: Groupes
    description: Groupes privés de joueurs et comparaison (Bearer JWT).
paths:
  /health:
    get:
      tags:
        - Santé
      summary: Santé du serveur
      responses:
        "200":
          description: Serveur opérationnel
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
                additionalProperties: false
              example:
                status: ok
  /auth/steam:
    get:
      tags:
        - Authentification
      summary: Démarre la connexion Steam
      description: À ouvrir par **navigation complète** (pas en fetch). Redirige vers Steam OpenID 2.0.
      responses:
        "302":
          description: Redirection vers https://steamcommunity.com/openid/login
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/steam/callback:
    get:
      tags:
        - Authentification
      summary: Retour de Steam (appelé par Steam)
      description: |-
        Vérifie l'assertion OpenID (localement puis via `check_authentication`), crée ou met à jour l'utilisateur, puis redirige vers le front :

        - succès : `<FRONT_URL>/auth/callback#token=<JWT>`
        - échec : `<FRONT_URL>/auth/callback?error=<code>` avec `STEAM_CANCELLED`, `STEAM_AUTH_FAILED`, `STEAM_UNAVAILABLE` ou `INVALID_STATE`.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: openid.*
          in: query
          required: false
          description: Paramètres OpenID 2.0 ajoutés par Steam.
          schema:
            type: string
      responses:
        "302":
          description: Redirection vers `<FRONT_URL>/auth/callback`
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      tags:
        - Authentification
      summary: Utilisateur courant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Utilisateur authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
              example:
                id: 665f1c2e9b1e8a0012345678
                steamId: "76561198957316510"
                displayName: Corvid
                avatarUrl: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /players/search:
    get:
      tags:
        - Joueurs
      summary: Rechercher un joueur
      description: Par pseudo Steam ou SteamID64. Cache 5 min.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: Corvid
      responses:
        "200":
          description: Résultats (éventuellement vides)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSearchResult"
              example:
                items:
                  - steamId: "76561198000000000"
                    accountId: 39734272
                    displayName: ExempleJoueur
                    avatarUrl: null
                meta:
                  fetchedAt: 2026-11-16T09:00:00.000Z
                  sourceUpdatedAt: null
                  isStale: false
                  isPartial: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}:
    get:
      tags:
        - Joueurs
      summary: Profil public et statistiques
      description: Statistiques calculées sur les **parties disponibles** (victoires/défaites). Si l’historique est indisponible, `stats` est entièrement `null` et `meta.isPartial` vaut `true`. Cache profil 15 min, historique 3 min.
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/refresh:
    post:
      tags:
        - Joueurs
      summary: Forcer l’actualisation d’un joueur
      description: "Relit profil Steam et historique auprès de Deadlock API sans attendre l’expiration du cache, puis renvoie la même réponse que `GET /players/{steamId}`. Délai minimum de **60 s par joueur** (partagé entre tous les utilisateurs) : pendant ce délai la copie actuelle est renvoyée sans appel au fournisseur. La date de la donnée est dans `meta.fetchedAt`. Fournisseur en échec : copie précédente avec `meta.isStale`. Aucun corps, aucune authentification."
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
      responses:
        "200":
          description: Profil actualisé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/matches:
    get:
      tags:
        - Joueurs
      summary: Historique des parties (paginé)
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: "Jeton opaque `nextCursor` de la page précédente, à transmettre tel quel avec les MÊMES filtres. Un curseur obtenu avec d’autres filtres (ou sans filtre) donne 400 : recommencer sans curseur."
          schema:
            type: string
            maxLength: 128
        - name: period
          in: query
          description: "`7d` et `30d` : fenêtre glissante UTC depuis l’instant de la requête. `season` : depuis le début de la saison classée courante (source Deadlock API) ; si inconnu, aucune borne et `meta.isPartial`. Absent : tout l’historique (comportement v1.8)."
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - season
        - name: gameMode
          in: query
          description: "Mode de jeu (axe indépendant de `matchMode`) : `normal` inclut classées et non classées. Une partie au mode inconnu n’est retenue que sous `all`."
          schema:
            type: string
            enum:
              - all
              - normal
              - street_brawl
            default: all
        - name: matchMode
          in: query
          description: Type de partie. Une partie au type inconnu n’est retenue que sous `all`.
          schema:
            type: string
            enum:
              - all
              - ranked
              - unranked
            default: all
        - name: heroId
          in: query
          schema:
            type: integer
            minimum: 1
        - name: outcome
          in: query
          schema:
            type: string
            enum:
              - all
              - win
              - loss
            default: all
        - name: include
          in: query
          description: "v1.13.0. `summary` : joint à chaque partie de la page son résumé (`summary`) et ajoute `summaryCoverage`. Parties lues 4 à la fois via le cache partagé avec `/matches/{matchId}` (7 jours). Ne change ni le tri, ni la pagination, ni le curseur."
          schema:
            type: string
            enum:
              - summary
      description: "Sans filtre : comportement v1.8 (tout l’historique). Avec filtres : sélection sur TOUT l’historique en cache, puis tri (`playedAt` décroissant, puis `matchId` décroissant) et pagination. 0 résultat : `items: []`."
      responses:
        "200":
          description: Page de parties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes:
    get:
      tags:
        - Catalogue
      summary: Héros jouables
      description: Données de jeu en anglais (comme en jeu), triées par nom. Cache 24 h.
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HeroSummary"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes/{heroId}:
    get:
      tags:
        - Catalogue
      summary: Détail d'un héros
      parameters:
        - name: heroId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 6
      responses:
        "200":
          description: Héros
          content:
            application/json:
              schema:
                type: object
                required:
                  - hero
                  - meta
                properties:
                  hero:
                    $ref: "#/components/schemas/HeroDetail"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ranks:
    get:
      tags:
        - Catalogue
      summary: Paliers de rang (0 à 11)
      responses:
        "200":
          description: Paliers, sans meta
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RankTier"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /map:
    get:
      tags:
        - Catalogue
      summary: Images de la carte
      responses:
        "200":
          description: URLs, sans meta
          content:
            application/json:
              schema:
                type: object
                required:
                  - minimap
                  - tunnels
                  - frame
                properties:
                  minimap:
                    type: string
                  tunnels:
                    type:
                      - string
                      - "null"
                  frame:
                    type:
                      - string
                      - "null"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes/stats:
    get:
      tags:
        - Catalogue
      summary: Méta de plusieurs héros en une requête
      description: "v1.14.0. Mêmes valeurs que `/heroes/{heroId}/stats`, lues dans le même cache (`analytics:hero-stats`, 30 min, une lecture source pour tous les héros). Sans `heroIds` : tous les héros jouables, par id croissant. Les ids inconnus ou non jouables vont dans `unknownHeroIds` (pas de 404). Fenêtre fixée par la source : 30 derniers jours, mode normal, ranked et unranked confondus (`scope`)."
      parameters:
        - name: heroIds
          in: query
          description: Liste `6,72,13` (1 à 64 ids positifs). Doublons retirés, ordre conservé dans `items`.
          schema:
            type: string
            pattern: ^\d{1,6}(,\d{1,6}){0,63}$
      responses:
        "200":
          description: Méta groupée
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeroMetaBatch"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes/{heroId}/stats:
    get:
      tags:
        - Catalogue
      summary: Statistiques méta d'un héros (30 derniers jours)
      description: Agrégées depuis `/v1/analytics/hero-stats?bucket=avg_badge`. `winRateByTier[].winRate` vaut `null` sous 200 parties pour le palier. Cache 30 min.
      parameters:
        - name: heroId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                required:
                  - stats
                  - meta
                properties:
                  stats:
                    $ref: "#/components/schemas/HeroMetaStats"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /leaderboard:
    get:
      tags:
        - Catalogue
      summary: Classement de la saison courante (100 premiers)
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum:
              - Europe
              - Asia
              - NAmerica
              - SAmerica
              - Oceania
            default: Europe
      responses:
        "200":
          description: Classement (cache 30 min, la source se met à jour chaque heure)
          content:
            application/json:
              schema:
                type: object
                required:
                  - region
                  - items
                  - coverage
                  - meta
                properties:
                  region:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry"
                  coverage:
                    type: object
                    description: v1.12.0. Fiabilité des enrichissements de la page.
                    required:
                      - entries
                      - withSteamId
                      - inferredSteamId
                      - withBadge
                      - withAvatar
                      - ranksComplete
                    properties:
                      entries:
                        type: integer
                      withSteamId:
                        type: integer
                      inferredSteamId:
                        type: integer
                      withBadge:
                        type: integer
                      withAvatar:
                        type: integer
                      ranksComplete:
                        type: boolean
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /matches/{matchId}:
    get:
      tags:
        - Joueurs
      summary: Détail d'une partie
      description: Deux équipes (amber, sapphire), joueurs triés par valeur nette. Cache 7 jours.
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            pattern: ^\d{1,19}$
      responses:
        "200":
          description: Partie
          content:
            application/json:
              schema:
                type: object
                required:
                  - match
                  - meta
                properties:
                  match:
                    $ref: "#/components/schemas/MatchDetail"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/rank-history:
    get:
      tags:
        - Joueurs
      summary: Historique de rang observé
      description: "Un point par partie classée dont le badge est connu (`ranked_display_badge`), du plus ancien au plus récent. Aucune interpolation ni MMR : les parties classées sans badge sont comptées dans `coverage.missingBadge`. `score = tier × 6 + subrank` (échelle des comparaisons de groupe)."
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - season
            default: season
      responses:
        "200":
          description: Points de rang
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RankHistory"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/activity:
    get:
      tags:
        - Joueurs
      summary: Activité par jour (heatmap)
      description: Un jour UTC par case, du plus ancien au plus récent (aujourd’hui inclus) ; les jours sans partie valent 0 (l’historique de la source est complet).
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: weeks
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 52
            default: 12
        - name: gameMode
          in: query
          description: "Mode de jeu (axe indépendant de `matchMode`) : `normal` inclut classées et non classées. Une partie au mode inconnu n’est retenue que sous `all`."
          schema:
            type: string
            enum:
              - all
              - normal
              - street_brawl
            default: all
        - name: matchMode
          in: query
          description: Type de partie. Une partie au type inconnu n’est retenue que sous `all`.
          schema:
            type: string
            enum:
              - all
              - ranked
              - unranked
            default: all
      responses:
        "200":
          description: Jours
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerActivity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/relationships:
    get:
      tags:
        - Joueurs
      summary: Coéquipiers et adversaires fréquents
      description: "Agrégats Deadlock API (`mate-stats`, `enemy-stats`) : parties communes et victoires DU JOUEUR DEMANDÉ. Un joueur souvent rencontré n’est pas un ami Steam ; `sameParty=true` ne garde que les parties jouées dans le même groupe (information de la source). Un seul mode par requête (la source n’agrège pas). Cache 10 min."
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: period
          in: query
          description: "`7d` et `30d` : fenêtre glissante UTC depuis l’instant de la requête. `season` : depuis le début de la saison classée courante (source Deadlock API) ; si inconnu, aucune borne et `meta.isPartial`. Absent : tout l’historique (comportement v1.8)."
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - season
        - name: gameMode
          in: query
          schema:
            type: string
            enum:
              - normal
              - street_brawl
            default: normal
        - name: sameParty
          in: query
          description: "Coéquipiers : seulement les parties jouées dans le même groupe"
          schema:
            type: string
            enum:
              - "true"
              - "false"
            default: "false"
        - name: minMatches
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 2
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: Relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerRelationships"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /items/stats:
    get:
      tags:
        - Catalogue
      summary: Statistiques d’utilisation des items
      description: "Agrégats Deadlock API (`/v1/analytics/item-stats`, mode de jeu normal) sur les parties analysées : achats, victoires, joueurs, reventes, heures moyennes. Seuil de la source : 20 parties par item. Cache 1 h par jeu de filtres."
      parameters:
        - name: period
          in: query
          description: Borne basse arrondie à l’heure (vers le passé)
          schema:
            type: string
            enum:
              - 7d
              - 30d
            default: 30d
        - name: matchMode
          in: query
          description: "Absent : tous types de partie"
          schema:
            type: string
            enum:
              - ranked
              - unranked
        - name: heroId
          in: query
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                required:
                  - filters
                  - items
                  - meta
                properties:
                  filters:
                    $ref: "#/components/schemas/AnalyticsFilters"
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ItemStats"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /items/{itemId}/stats:
    get:
      tags:
        - Catalogue
      summary: Statistiques d’un item
      description: "`stats: null` et note `below_source_threshold` si l’item a moins de 20 parties sur les filtres. 404 si l’item n’existe pas dans le catalogue."
      parameters:
