# Copie figée du contrat OpenAPI du backend
# Source : thebaroness-back, docs/openapi.yaml v1.4.1, commit 3303b45 (16/11/2026)
# Généré depuis src/docs/openapi.ts (v1.4.1) par `npm run openapi`.
# Ne pas modifier à la main.
openapi: 3.1.0
info:
  title: thebaroness API
  version: 1.4.1
  description: 'API du tracker de statistiques Deadlock. Les statistiques proviennent de Deadlock API (api.deadlock-api.com, source communautaire indépendante de Valve) ; l''espace privé est stocké dans MongoDB. Erreurs : `{ "error": { "code", "message" } }`. Inconnu = `null`, jamais 0.'
servers:
  - url: /api
tags:
  - name: Santé
  - name: Authentification
    description: Connexion Steam OpenID uniquement.
  - name: Joueurs
    description: Données publiques issues de Deadlock API, avec cache.
  - name: Suivis
    description: Liste privée de joueurs suivis (Bearer JWT).
  - name: Catalogue
    description: Héros, rangs, carte (assets Deadlock, en anglais).
  - name: Groupes
    description: Groupes privés de joueurs et comparaison (Bearer JWT).
paths:
  /health:
    get:
      tags:
        - Santé
      summary: Santé du serveur
      responses:
        "200":
          description: Serveur opérationnel
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    const: ok
                additionalProperties: false
              example:
                status: ok
  /auth/steam:
    get:
      tags:
        - Authentification
      summary: Démarre la connexion Steam
      description: À ouvrir par **navigation complète** (pas en fetch). Redirige vers Steam OpenID 2.0.
      responses:
        "302":
          description: Redirection vers https://steamcommunity.com/openid/login
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/steam/callback:
    get:
      tags:
        - Authentification
      summary: Retour de Steam (appelé par Steam)
      description: |-
        Vérifie l'assertion OpenID (localement puis via `check_authentication`), crée ou met à jour l'utilisateur, puis redirige vers le front :

        - succès : `<FRONT_URL>/auth/callback#token=<JWT>`
        - échec : `<FRONT_URL>/auth/callback?error=<code>` avec `STEAM_CANCELLED`, `STEAM_AUTH_FAILED`, `STEAM_UNAVAILABLE` ou `INVALID_STATE`.
      parameters:
        - name: state
          in: query
          required: true
          schema:
            type: string
        - name: openid.*
          in: query
          required: false
          description: Paramètres OpenID 2.0 ajoutés par Steam.
          schema:
            type: string
      responses:
        "302":
          description: Redirection vers `<FRONT_URL>/auth/callback`
        "429":
          $ref: "#/components/responses/RateLimited"
  /auth/me:
    get:
      tags:
        - Authentification
      summary: Utilisateur courant
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Utilisateur authentifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicUser"
              example:
                id: 665f1c2e9b1e8a0012345678
                steamId: "76561198957316510"
                displayName: Corvid
                avatarUrl: null
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /players/search:
    get:
      tags:
        - Joueurs
      summary: Rechercher un joueur
      description: Par pseudo Steam ou SteamID64. Cache 5 min.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
          example: Corvid
      responses:
        "200":
          description: Résultats (éventuellement vides)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerSearchResult"
              example:
                items:
                  - steamId: "76561198000000000"
                    accountId: 39734272
                    displayName: ExempleJoueur
                    avatarUrl: null
                meta:
                  fetchedAt: 2026-11-16T09:00:00.000Z
                  sourceUpdatedAt: null
                  isStale: false
                  isPartial: false
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}:
    get:
      tags:
        - Joueurs
      summary: Profil public et statistiques
      description: Statistiques calculées sur les **parties disponibles** (victoires/défaites). Si l’historique est indisponible, `stats` est entièrement `null` et `meta.isPartial` vaut `true`. Cache profil 15 min, historique 3 min.
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
      responses:
        "200":
          description: Profil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayerProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/matches:
    get:
      tags:
        - Joueurs
      summary: Historique des parties (paginé)
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          description: Jeton opaque `nextCursor` de la page précédente, à transmettre tel quel.
          schema:
            type: string
            maxLength: 128
      responses:
        "200":
          description: Page de parties
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MatchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes:
    get:
      tags:
        - Catalogue
      summary: Héros jouables
      description: Données de jeu en anglais (comme en jeu), triées par nom. Cache 24 h.
      responses:
        "200":
          description: Catalogue
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/HeroSummary"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes/{heroId}:
    get:
      tags:
        - Catalogue
      summary: Détail d'un héros
      parameters:
        - name: heroId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 6
      responses:
        "200":
          description: Héros
          content:
            application/json:
              schema:
                type: object
                required:
                  - hero
                  - meta
                properties:
                  hero:
                    $ref: "#/components/schemas/HeroDetail"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /ranks:
    get:
      tags:
        - Catalogue
      summary: Paliers de rang (0 à 11)
      responses:
        "200":
          description: Paliers, sans meta
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/RankTier"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /map:
    get:
      tags:
        - Catalogue
      summary: Images de la carte
      responses:
        "200":
          description: URLs, sans meta
          content:
            application/json:
              schema:
                type: object
                required:
                  - minimap
                  - tunnels
                  - frame
                properties:
                  minimap:
                    type: string
                  tunnels:
                    type:
                      - string
                      - "null"
                  frame:
                    type:
                      - string
                      - "null"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /heroes/{heroId}/stats:
    get:
      tags:
        - Catalogue
      summary: Statistiques méta d'un héros (30 derniers jours)
      description: Agrégées depuis `/v1/analytics/hero-stats?bucket=avg_badge`. `winRateByTier[].winRate` vaut `null` sous 200 parties pour le palier. Cache 30 min.
      parameters:
        - name: heroId
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Statistiques
          content:
            application/json:
              schema:
                type: object
                required:
                  - stats
                  - meta
                properties:
                  stats:
                    $ref: "#/components/schemas/HeroMetaStats"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /leaderboard:
    get:
      tags:
        - Catalogue
      summary: Classement de la saison courante (100 premiers)
      parameters:
        - name: region
          in: query
          schema:
            type: string
            enum:
              - Europe
              - Asia
              - NAmerica
              - SAmerica
              - Oceania
            default: Europe
      responses:
        "200":
          description: Classement (cache 30 min, la source se met à jour chaque heure)
          content:
            application/json:
              schema:
                type: object
                required:
                  - region
                  - items
                  - meta
                properties:
                  region:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeaderboardEntry"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /matches/{matchId}:
    get:
      tags:
        - Joueurs
      summary: Détail d'une partie
      description: Deux équipes (amber, sapphire), joueurs triés par valeur nette. Cache 7 jours.
      parameters:
        - name: matchId
          in: path
          required: true
          schema:
            type: string
            pattern: ^\d{1,19}$
      responses:
        "200":
          description: Partie
          content:
            application/json:
              schema:
                type: object
                required:
                  - match
                  - meta
                properties:
                  match:
                    $ref: "#/components/schemas/MatchDetail"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /players/{steamId}/heroes:
    get:
      tags:
        - Joueurs
      summary: Statistiques d'un joueur par héros
      description: Sur les parties disponibles (même source que le profil), tri par parties.
      parameters:
        - name: steamId
          in: path
          required: true
          description: SteamID64 (17 chiffres), toujours transmis en chaîne.
          schema:
            type: string
            pattern: ^\d{17}$
          example: "76561198957316510"
      responses:
        "200":
          description: Héros joués
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                  - meta
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/PlayerHeroStat"
                  meta:
                    $ref: "#/components/schemas/DataMeta"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "502":
          $ref: "#/components/responses/UpstreamError"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /groups:
    get:
      tags:
        - Groupes
      summary: Lister mes groupes
      description: Du plus récemment modifié au plus ancien.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 'Groupes (vide : `{ "items": [] }`)'
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Group"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Groupes
      summary: Créer un groupe
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: Groupe créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
  /groups/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        example: 507f1f77bcf86cd799439012
    get:
      tags:
        - Groupes
      summary: Consulter un groupe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Groupe
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags:
        - Groupes
      summary: Modifier un groupe (nom et/ou membres)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 60
                steamIds:
                  type: array
                  minItems: 2
                  maxItems: 20
                  uniqueItems: true
                  items:
                    type: string
      responses:
        "200":
          description: Groupe modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - Groupes
      summary: Supprimer un groupe
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Supprimé, sans corps
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
  /groups/{id}/compare:
    get:
      tags:
        - Groupes
      summary: Comparer les membres sur une période
      description: "`7d` et `30d` glissants ; `season` depuis le début de la saison classée courante (toutes les parties si elle est inconnue). Un membre indisponible est omis avec `meta.isPartial` ; tous indisponibles → 503."
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: ^[a-fA-F0-9]{24}$
          example: 507f1f77bcf86cd799439012
        - name: period
          in: query
          schema:
            type: string
            enum:
              - 7d
              - 30d
              - season
            default: 30d
      responses:
        "200":
          description: Comparaison
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupCompare"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
  /tracked-players:
    get:
      tags:
        - Suivis
      summary: Lister mes suivis
      description: Uniquement ceux du compte authentifié, du plus récemment modifié au plus ancien.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 'Liste (vide : `{ "items": [] }`)'
          content:
            application/json:
              schema:
                type: object
                required:
                  - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/TrackedPlayer"
              example:
                items:
                  - id: 507f1f77bcf86cd799439012
                    steamId: "76561198000000000"
                    alias: Duo régulier
                    note: Joue souvent en classé
                    tags:
                      - duo
                      - ranked
                    createdAt: 2026-11-16T09:00:00.000Z
                    updatedAt: 2026-11-16T09:00:00.000Z
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/RateLimited"
    post:
      tags:
        - Suivis
      summary: Suivre un joueur
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedPlayerCreate"
            example:
              steamId: "76561198000000000"
              alias: Duo régulier
              note: Joue souvent en classé
              tags:
                - duo
                - ranked
      responses:
        "201":
          description: Suivi créé
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedPlayer"
              example:
                id: 507f1f77bcf86cd799439012
                steamId: "76561198000000000"
                alias: Duo régulier
                note: Joue souvent en classé
                tags:
                  - duo
                  - ranked
                createdAt: 2026-11-16T09:00:00.000Z
                updatedAt: 2026-11-16T09:00:00.000Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Joueur déjà suivi par ce compte
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                error:
                  code: ALREADY_TRACKED
                  message: Ce joueur est déjà dans votre liste.
        "429":
          $ref: "#/components/responses/RateLimited"
  /tracked-players/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        example: 507f1f77bcf86cd799439012
    get:
      tags:
        - Suivis
      summary: Consulter un suivi
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Suivi
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedPlayer"
              example:
                id: 507f1f77bcf86cd799439012
                steamId: "76561198000000000"
                alias: Duo régulier
                note: Joue souvent en classé
                tags:
                  - duo
                  - ranked
                createdAt: 2026-11-16T09:00:00.000Z
                updatedAt: 2026-11-16T09:00:00.000Z
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    patch:
      tags:
        - Suivis
      summary: Modifier un suivi (partiel)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrackedPlayerUpdate"
            example:
              note: Analyse mise à jour
      responses:
        "200":
          description: Suivi modifié
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrackedPlayer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
    delete:
      tags:
        - Suivis
      summary: Supprimer un suivi
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Supprimé, sans corps
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT HS256 obtenu via la connexion Steam (`#token=` au retour).
  responses:
    BadRequest:
      description: Entrée invalide (champ, identifiant, JSON, PATCH vide…)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: INVALID_INPUT
              message: "tags : 10 tags maximum"
    Unauthorized:
      description: Jeton absent, invalide ou expiré
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UNAUTHORIZED
              message: Session absente ou expirée.
    NotFound:
      description: Ressource absente ou appartenant à un autre compte (pas de divulgation d'existence)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: NOT_FOUND
              message: Ressource introuvable.
    RateLimited:
      description: Trop de requêtes
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: RATE_LIMITED
              message: Trop de requêtes, réessayez dans quelques instants.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes
    UpstreamError:
      description: Réponse inexploitable du fournisseur de statistiques
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: UPSTREAM_ERROR
              message: Réponse inexploitable du fournisseur de statistiques.
    ServiceUnavailable:
      description: Fournisseur de statistiques indisponible et aucune copie en cache
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: SERVICE_UNAVAILABLE
              message: Les statistiques sont temporairement indisponibles.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Secondes
  schemas:
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
              enum:
                - INVALID_INPUT
                - UNAUTHORIZED
                - NOT_FOUND
                - ALREADY_TRACKED
                - RATE_LIMITED
                - UPSTREAM_ERROR
                - SERVICE_UNAVAILABLE
                - INTERNAL_ERROR
            message:
              type: string
    DataMeta:
      type: object
      required:
        - fetchedAt
        - sourceUpdatedAt
        - isStale
        - isPartial
      properties:
        fetchedAt:
          type: string
          format: date-time
          description: Date de collecte
        sourceUpdatedAt:
          type:
            - string
            - "null"
          format: date-time
        isStale:
          type: boolean
          description: Copie en cache servie faute de fournisseur
        isPartial:
          type: boolean
          description: Une partie des données est indisponible
    PublicUser:
      type: object
      required:
        - id
        - steamId
        - displayName
        - avatarUrl
      properties:
        id:
          type: string
        steamId:
          type: string
          pattern: ^\d{17}$
        displayName:
          type: string
          description: "Pseudo Steam (repli : le steamId)"
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
    PlayerSummary:
      type: object
      required:
        - steamId
        - accountId
        - displayName
        - avatarUrl
      properties:
        steamId:
          type: string
          pattern: ^\d{17}$
        accountId:
          type: integer
          description: SteamID3 (32 bits)
        displayName:
          type: string
        avatarUrl:
          type:
            - string
            - "null"
          format: uri
    PlayerSearchResult:
      type: object
      required:
        - items
        - meta
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlayerSummary"
        meta:
          $ref: "#/components/schemas/DataMeta"
    PlayerStats:
      type: object
      description: Agrégats sur les parties disponibles ; `null` si inconnu.
      required:
        - matchesPlayed
        - wins
        - losses
        - winRate
        - kills
        - deaths
        - assists
        - kda
      properties:
        matchesPlayed:
          type:
            - integer
            - "null"
        wins:
          type:
            - integer
            - "null"
        losses:
          type:
            - integer
            - "null"
        winRate:
          type:
            - number
            - "null"
          description: En %, 2 décimales
        kills:
          type:
            - integer
            - "null"
        deaths:
          type:
            - integer
            - "null"
        assists:
          type:
            - integer
            - "null"
        kda:
          type:
            - number
            - "null"
          description: (K + A) / max(D, 1), 2 décimales
    PlayerProfile:
      type: object
      required:
        - player
        - stats
        - rank
        - meta
      properties:
        player:
          allOf:
            - $ref: "#/components/schemas/PlayerSummary"
            - type: object
              properties:
                region:
                  type:
                    - string
                    - "null"
                  description: Code pays Steam (ex. FR)
        stats:
          $ref: "#/components/schemas/PlayerStats"
        rank:
          $ref: "#/components/schemas/PlayerRank"
        meta:
          $ref: "#/components/schemas/DataMeta"
    PlayerRank:
      type: object
      description: Rang issu de la partie classée la plus récente (`ranked_display_badge`). Tout à `null` si aucune partie classée connue.
      required:
        - badgeId
        - name
        - tier
        - subrank
        - imageUrl
        - color
      properties:
        badgeId:
          type:
            - integer
            - "null"
          description: "`tier * 10 + subrank` (ex. 113)"
        name:
          type:
            - string
            - "null"
          example: Eternus 3
        tier:
          type:
            - integer
            - "null"
          minimum: 0
          maximum: 11
        subrank:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 6
        imageUrl:
          type:
            - string
            - "null"
          format: uri
        color:
          type:
            - string
            - "null"
          example: "#5CE9A9"
    RankTier:
      type: object
      required:
        - tier
        - name
        - color
        - imageUrl
        - subranks
      properties:
        tier:
          type: integer
          minimum: 0
          maximum: 11
        name:
          type: string
          example: Eternus
        color:
          type: string
        imageUrl:
          type: string
          format: uri
        subranks:
          type: array
          minItems: 6
          maxItems: 6
          description: Images des sous-rangs 1 à 6 (index 0 = sous-rang 1)
          items:
            type:
              - string
              - "null"
            format: uri
    HeroImages:
      type: object
      required:
        - card
        - small
        - vertical
        - background
        - name
      properties:
        card:
          type: string
        small:
          type: string
        vertical:
          type: string
        background:
          type: string
        name:
          type:
            - string
            - "null"
    HeroSummary:
      type: object
      required:
        - id
        - name
        - role
        - gunTag
        - complexity
        - tags
        - color
        - images
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
          enum:
            - assassin
            - brawler
            - marksman
            - mystic
            - healer
        gunTag:
          type:
            - string
            - "null"
        complexity:
          type:
            - integer
            - "null"
        tags:
          type: array
          items:
            type: string
        color:
          type: string
          description: Couleur d’accent hexadécimale
        images:
          $ref: "#/components/schemas/HeroImages"
    HeroDetail:
      allOf:
        - $ref: "#/components/schemas/HeroSummary"
        - type: object
          required:
            - lore
            - stats
            - abilities
          properties:
            lore:
              type: string
            stats:
              type: array
              items:
                type: object
                required:
                  - key
                  - label
                  - value
                properties:
                  key:
                    type: string
                  label:
                    type: string
                  value:
                    type: number
            abilities:
              type: array
              items:
                type: object
                required:
                  - id
                  - name
                  - imageUrl
                  - type
                  - description
                  - cooldownSeconds
                properties:
                  id:
                    type: integer
                  name:
                    type: string
                  imageUrl:
                    type:
                      - string
                      - "null"
                  type:
                    type: string
                    enum:
                      - signature
                      - ultimate
                  description:
                    type: string
                  cooldownSeconds:
                    type:
                      - number
                      - "null"
    Group:
      type: object
      required:
        - id
        - name
        - steamIds
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        name:
          type: string
        steamIds:
          type: array
          items:
            type: string
            pattern: ^\d{17}$
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    GroupInput:
      type: object
      required:
        - name
        - steamIds
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 60
          description: Trim appliqué
        steamIds:
          type: array
          minItems: 2
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            pattern: ^\d{17}$
    GroupCompare:
      type: object
      required:
        - group
        - period
        - members
        - meta
      properties:
        group:
          $ref: "#/components/schemas/Group"
        period:
          type: string
          enum:
            - 7d
            - 30d
            - season
        members:
          type: array
          items:
            type: object
            required:
              - steamId
              - displayName
              - avatarUrl
              - rank
              - matches
              - wins
              - losses
              - winRate
              - kda
              - longestWinStreak
              - bestMatch
              - rankHistory
            properties:
              steamId:
                type: string
              displayName:
                type: string
              avatarUrl:
                type:
                  - string
                  - "null"
              rank:
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/PlayerRank"
              matches:
                type: integer
              wins:
                type: integer
              losses:
                type: integer
              winRate:
                type:
                  - number
                  - "null"
              kda:
                type:
                  - number
                  - "null"
                description: (K + A) / max(D, 1)
              longestWinStreak:
                type: integer
              bestMatch:
                oneOf:
                  - type: "null"
                  - type: object
                    required:
                      - matchId
                      - playedAt
                      - heroName
                      - heroImageUrl
                      - kills
                      - deaths
                      - assists
                      - netWorth
                      - kda
                    properties:
                      matchId:
                        type: string
                      playedAt:
                        type: string
                        format: date-time
                      heroName:
                        type: string
                      heroImageUrl:
                        type:
                          - string
                          - "null"
                      kills:
                        type: integer
                      deaths:
                        type: integer
                      assists:
                        type: integer
                      netWorth:
                        type:
                          - integer
                          - "null"
                      kda:
                        type:
                          - number
                          - "null"
              rankHistory:
                type: array
                description: Parties classées de la période, du plus ancien au plus récent
                items:
                  type: object
                  required:
                    - at
                    - score
                  properties:
                    at:
                      type: string
                      format: date-time
                    score:
                      type: integer
                      minimum: 1
                      maximum: 72
                      description: tier * 6 + subrank
        meta:
          $ref: "#/components/schemas/DataMeta"
    HeroMetaStats:
      type: object
      required:
        - heroId
        - matches
        - winRate
        - pickRate
        - avgKills
        - avgDeaths
        - avgAssists
        - winRateByTier
      properties:
        heroId:
          type: integer
        matches:
          type:
            - integer
            - "null"
        winRate:
          type:
            - number
            - "null"
          description: "%"
        pickRate:
          type:
            - number
            - "null"
          description: "% des parties"
        avgKills:
          type:
            - number
            - "null"
        avgDeaths:
          type:
            - number
            - "null"
        avgAssists:
          type:
            - number
            - "null"
        winRateByTier:
          type: array
          minItems: 12
          maxItems: 12
          items:
            type: object
            required:
              - tier
              - winRate
              - matches
            properties:
              tier:
                type: integer
                minimum: 0
                maximum: 11
              winRate:
                type:
                  - number
                  - "null"
                description: null sous 200 parties
              matches:
                type:
                  - integer
                  - "null"
    LeaderboardEntry:
      type: object
      required:
        - rank
        - displayName
        - steamId
        - badge
        - topHeroes
      properties:
        rank:
          type: integer
          description: Position (ex aequo possibles)
        displayName:
          type: string
        steamId:
          type:
            - string
            - "null"
          description: Seulement si la source relie le pseudo à un seul compte
        badge:
          description: "Toujours null : Deadlock API ne fournit pas le rang par joueur dans le classement."
          oneOf:
            - type: "null"
            - type: object
              required:
                - tier
                - subrank
                - name
                - imageUrl
              properties:
                tier:
                  type: integer
                subrank:
                  type: integer
                name:
                  type: string
                imageUrl:
                  type:
                    - string
                    - "null"
        topHeroes:
          type: array
          maxItems: 3
          items:
            type: object
            required:
              - heroId
              - name
              - imageUrl
            properties:
              heroId:
                type: integer
              name:
                type: string
              imageUrl:
                type:
                  - string
                  - "null"
    MatchPlayer:
      type: object
      required:
        - steamId
        - displayName
        - heroId
        - heroName
        - heroImageUrl
        - level
        - kills
        - deaths
        - assists
        - netWorth
        - lastHits
        - denies
      properties:
        steamId:
          type:
            - string
            - "null"
        displayName:
          type: string
          description: "Repli : SteamID, puis « Joueur inconnu »"
        heroId:
          type: integer
        heroName:
          type: string
        heroImageUrl:
          type:
            - string
            - "null"
        level:
          type:
            - integer
            - "null"
        kills:
          type:
            - integer
            - "null"
        deaths:
          type:
            - integer
            - "null"
        assists:
          type:
            - integer
            - "null"
        netWorth:
          type:
            - integer
            - "null"
        lastHits:
          type:
            - integer
            - "null"
        denies:
          type:
            - integer
            - "null"
    MatchDetail:
      type: object
      required:
        - matchId
        - playedAt
        - durationSeconds
        - winningSide
        - teams
      properties:
        matchId:
          type: string
        playedAt:
          type:
            - string
            - "null"
          format: date-time
        durationSeconds:
          type:
            - integer
            - "null"
        winningSide:
          type:
            - string
            - "null"
          enum:
            - amber
            - sapphire
            - null
        teams:
          type: array
          items:
            type: object
            required:
              - side
              - outcome
              - players
            properties:
              side:
                type: string
                enum:
                  - amber
                  - sapphire
              outcome:
                type: string
                enum:
                  - win
                  - loss
              players:
                type: array
                items:
                  $ref: "#/components/schemas/MatchPlayer"
    PlayerHeroStat:
      type: object
      required:
        - heroId
        - heroName
        - heroImageUrl
        - matches
        - wins
        - winRate
        - kda
      properties:
        heroId:
          type: integer
        heroName:
          type: string
        heroImageUrl:
          type:
            - string
            - "null"
        matches:
          type: integer
        wins:
          type: integer
        winRate:
          type:
            - number
            - "null"
        kda:
          type:
            - number
            - "null"
    MatchSummary:
      type: object
      required:
        - matchId
        - playedAt
        - heroId
        - heroName
        - heroImageUrl
        - outcome
        - durationSeconds
        - kills
        - deaths
        - assists
        - netWorth
      properties:
        matchId:
          type: string
        playedAt:
          type: string
          format: date-time
        heroId:
          type: integer
        heroName:
          type: string
          description: "Repli `Héros #<id>` si catalogue indisponible"
        heroImageUrl:
          type:
            - string
            - "null"
          description: Portrait (null sans catalogue)
        outcome:
          type: string
          enum:
            - win
            - loss
        durationSeconds:
          type:
            - integer
            - "null"
        kills:
          type:
            - integer
            - "null"
        deaths:
          type:
            - integer
            - "null"
        assists:
          type:
            - integer
            - "null"
        netWorth:
          type:
            - integer
            - "null"
    MatchPage:
      type: object
      required:
        - items
        - nextCursor
        - meta
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MatchSummary"
        nextCursor:
          type:
            - string
            - "null"
        meta:
          $ref: "#/components/schemas/DataMeta"
    TrackedPlayer:
      type: object
      required:
        - id
        - steamId
        - alias
        - note
        - tags
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
        steamId:
          type: string
          pattern: ^\d{17}$
        alias:
          type: string
        note:
          type: string
        tags:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TrackedPlayerCreate:
      type: object
      required:
        - steamId
      additionalProperties: false
      properties:
        steamId:
          type: string
          pattern: ^\d{17}$
        alias:
          type: string
          maxLength: 80
          description: Trim appliqué
        note:
          type: string
          maxLength: 1000
          description: Trim appliqué
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 24
    TrackedPlayerUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      description: "`steamId`, `id`, `ownerId` et dates sont refusés (400)."
      properties:
        alias:
          type: string
          maxLength: 80
        note:
          type: string
          maxLength: 1000
        tags:
          type: array
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 24
