server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # En-têtes de sécurité. connect-src : le back de production ; images : catalogue Deadlock et avatars Steam.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets-bucket.deadlock-api.com https://api.deadlock-api.com https://*.steamstatic.com; font-src 'self'; connect-src 'self' https://api.thebaroness.4esport.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  # Les assets Vite sont hachés : cache long.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Repli SPA pour React Router.
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets-bucket.deadlock-api.com https://api.deadlock-api.com https://*.steamstatic.com; font-src 'self'; connect-src 'self' https://api.thebaroness.4esport.fr; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    try_files $uri /index.html;
  }
}
