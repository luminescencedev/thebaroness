            - 30d
            - season
            - null
        gameMode:
          type: string
          enum:
            - all
            - normal
            - street_brawl
        matchMode:
          type: string
          enum:
            - all
            - ranked
            - unranked
        heroId:
          type:
            - integer
            - "null"
        outcome:
          type: string
          enum:
            - all
            - win
            - loss
    PlayerOverview:
      type: object
      required:
        - filters
        - summary
        - modes
        - topHeroes
        - coverage
        - meta
      properties:
        filters:
          type: object
          required:
            - period
            - gameMode
            - matchMode
          properties:
            period:
              type: string
              enum:
                - 7d
                - 30d
                - season
            gameMode:
              type: string
              enum:
                - all
                - normal
                - street_brawl
            matchMode:
              type: string
              enum:
                - all
                - ranked
                - unranked
        summary:
          type: object
          required:
            - matches
            - wins
            - losses
            - winRate
            - kills
            - deaths
            - assists
            - kda
            - kdaSampleSize
            - avgNetWorthPerMinute
            - netWorthPerMinuteSampleSize
            - avgDurationSeconds
            - durationSampleSize
            - lastMatchAt
          properties:
            matches:
              type: integer
            wins:
              type: integer
            losses:
              type: integer
            winRate:
              type:
                - number
                - "null"
              description: null si aucune partie
            kills:
              type:
                - integer
                - "null"
              description: Total sur les parties complètes (K, D, A connus)
            deaths:
              type:
                - integer
                - "null"
            assists:
              type:
                - integer
                - "null"
            kda:
              type:
                - number
                - "null"
              description: "`(kills + assists) / max(deaths, 1)` sur ce même sous-ensemble, 2 décimales."
            kdaSampleSize:
              type: integer
              minimum: 0
              description: Nombre de parties utilisées pour kills, deaths, assists et kda.
            avgNetWorthPerMinute:
              type:
                - number
                - "null"
              description: Moyenne des ratios par partie `netWorth / (durationSeconds / 60)`, et non total / total.
            netWorthPerMinuteSampleSize:
              type: integer
              minimum: 0
              description: Nombre de parties utilisées pour le net worth par minute.
            avgDurationSeconds:
              type:
                - integer
                - "null"
            durationSampleSize:
              type: integer
              minimum: 0
              description: Nombre de parties utilisées pour la durée moyenne.
            lastMatchAt:
              type:
                - string
                - "null"
              format: date-time
        modes:
          type: array
          description: Combinaisons observées (modes connus), par volume décroissant. Somme des `matches` + `coverage.unknownModeMatches` = `summary.matches`.
          items:
            type: object
            required:
              - gameMode
              - matchMode
              - matches
              - wins
              - losses
              - winRate
            properties:
              gameMode:
                type: string
              matchMode:
                type: string
              matches:
                type: integer
              wins:
                type: integer
              losses:
                type: integer
              winRate:
                type: number
        topHeroes:
          type: array
          maxItems: 3
          items:
            type: object
            required:
              - heroId
              - heroName
              - heroImageUrl
              - matches
              - wins
              - losses
              - winRate
              - kda
              - kdaSampleSize
            properties:
              heroId:
                type: integer
              heroName:
                type: string
              heroImageUrl:
                type:
                  - string
                  - "null"
              matches:
                type: integer
              wins:
                type: integer
              losses:
                type: integer
              winRate:
                type:
                  - number
                  - "null"
              kda:
                type:
                  - number
                  - "null"
              kdaSampleSize:
                type: integer
                minimum: 0
                description: Nombre de parties utilisées pour le KDA.
        coverage:
          type: object
          required:
            - requestedFrom
            - requestedTo
            - observedFrom
            - observedTo
            - includedMatches
            - excludedUnknownMode
            - unknownModeMatches
            - isPartial
            - notes
          properties:
            requestedFrom:
              type:
                - string
                - "null"
              format: date-time
              description: null si `season` et début de saison inconnu
            requestedTo:
              type: string
              format: date-time
            observedFrom:
              type:
                - string
                - "null"
              format: date-time
              description: Première partie retenue (null si aucune)
            observedTo:
              type:
                - string
                - "null"
              format: date-time
            includedMatches:
              type: integer
            excludedUnknownMode:
              type: integer
              description: Parties écartées car leur mode est inconnu alors qu’un mode précis est demandé
            unknownModeMatches:
              type: integer
              description: Parties retenues (filtre `all`) au mode inconnu, absentes de `modes`
            isPartial:
              type: boolean
              description: true si la période n’a pas pu être appliquée (début de saison inconnu)
            notes:
              type: array
              items:
                type: string
                enum:
                  - season_start_unknown
                  - unknown_mode_excluded
                  - unknown_mode_included
                  - history_stale
        meta:
          $ref: "#/components/schemas/DataMeta"
