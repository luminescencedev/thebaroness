                      - displayName
                      - avatarUrl
                    properties:
                      displayName:
                        type: string
                      avatarUrl:
                        type:
                          - string
                          - "null"
              rank:
                description: Badge de la dernière partie classée (rang « non classé » si aucune) ; null si inconnu.
                oneOf:
                  - type: "null"
                  - $ref: "#/components/schemas/PlayerRank"
              lastMatchAt:
                type:
                  - string
                  - "null"
                format: date-time
              form:
                oneOf:
                  - type: "null"
                  - type: object
                    required:
                      - results
                      - matchIds
                      - wins
                      - losses
                      - winRate
                      - sampleSize
                      - requestedSize
                    properties:
                      results:
                        type: array
                        description: Du plus récent au plus ancien
                        items:
